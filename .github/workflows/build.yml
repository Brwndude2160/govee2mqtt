name: Container Build

on:
  pull_request:
    branches:
      - maintained
  push:
    tags:
      - "20*"
    branches:
      - maintained
    paths:
      - "**/*.rs"
      - "addon/**"
      - "**/Cargo.*"
      - ".github/workflows/build.yml"
      - ".cargo/config.toml"
      - "scripts/build-cross.sh"
      - "scripts/build-docker.sh"
      - "Dockerfile"
      - ".dockerignore"

env:
  IMAGE: ghcr.io/brwndude2160/govee2mqtt

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Docker meta
        if: ${{ github.event_name != 'pull_request' }}
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/maintained' }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/maintained' }}
            type=ref,event=tag
            type=ref,event=pr
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to the Container registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: https://ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "Install Rust"
        uses: dtolnay/rust-toolchain@stable
      - name: "Install cross from Cargo"
        uses: baptiste0928/cargo-install@v3
        with:
          crate: "cross"
      - name: Build executable
        run: ./scripts/build-cross.sh ${{ matrix.platform }}
      - name: Build No Push
        if: ${{ github.event_name == 'pull_request' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
      - name: Build and push by digest
        if: ${{ github.event_name != 'pull_request' }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.event_name != 'pull_request' }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        if: ${{ github.event_name != 'pull_request' }}
        id: digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          echo "DIGEST_NAME=$(echo ${{ matrix.platform }} | sed 's,/,-,g')" >> $GITHUB_OUTPUT
      - name: Upload digest
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ steps.digest.outputs.DIGEST_NAME }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    needs:
      - build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/maintained' }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/maintained' }}
            type=ref,event=tag,enable=${{ github.ref_type == 'tag' }}
            type=ref,event=pr
      - name: Login to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: https://ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            ${{ github.event_name == 'pull_request' && '--dry-run' || '' }} \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
  # Home Assistant add-on images (ghcr.io/brwndude2160/govee2mqtt-{arch}),
  # built with the composable home-assistant/builder actions. Tag pushes
  # publish and sign; everything else is a test build.
  addon:
    needs:
      - build
      - merge
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.merge.result == 'success' || needs.merge.result == 'skipped') }}
    name: addon (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
      BASE_IMAGE: ghcr.io/home-assistant/base-debian:bookworm
      BASE_IDENTITY: https://github.com/home-assistant/docker-base/.*
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Read add-on info
        id: info
        run: |
          get() { sed -n "s/^$1: *//p" addon/config.yaml | head -1 | tr -d '"'; }
          echo "name=$(get name)" >> "$GITHUB_OUTPUT"
          echo "description=$(get description)" >> "$GITHUB_OUTPUT"
          echo "url=$(get url)" >> "$GITHUB_OUTPUT"
          version=$(get version)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "${PUBLISH}" = "true" ]; then
            if [ "${version}" != "${GITHUB_REF_NAME}" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} doesn't match addon/config.yaml version ${version}"
              exit 1
            fi
            echo "govee_image=${IMAGE}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "govee_image=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          fi
      # build-image only verifies the base image when pushing, so test
      # builds verify it here.
      - name: Install Cosign
        if: ${{ env.PUBLISH != 'true' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify base image
        if: ${{ env.PUBLISH != 'true' }}
        uses: home-assistant/builder/actions/cosign-verify@2026.09.0
        with:
          image: ${{ env.BASE_IMAGE }}
          cosign-identity: ${{ env.BASE_IDENTITY }}
      - name: Log in to GHCR
        if: ${{ env.PUBLISH != 'true' && github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build add-on image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./addon
          image: ${{ env.IMAGE }}-${{ matrix.arch }}
          image-tags: |
            ${{ steps.info.outputs.version }}
            latest
          version: ${{ steps.info.outputs.version }}
          push: ${{ env.PUBLISH }}
          cosign: ${{ env.PUBLISH }}
          cosign-base-verify: ${{ env.BASE_IMAGE }}
          cosign-base-identity: ${{ env.BASE_IDENTITY }}
          build-args: |
            BUILD_FROM=${{ env.BASE_IMAGE }}
            GOVEE_IMAGE=${{ steps.info.outputs.govee_image }}
          labels: |
            io.hass.type=app
            io.hass.name=${{ steps.info.outputs.name }}
            io.hass.description=${{ steps.info.outputs.description }}
            io.hass.url=${{ steps.info.outputs.url }}
