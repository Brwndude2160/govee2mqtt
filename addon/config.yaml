name: Govee to MQTT Bridge (maintained)
image: ghcr.io/brwndude2160/govee2mqtt-{arch}
version: "1.1.0"
slug: govee2mqtt
description: Control Govee Devices
url: https://github.com/Brwndude2160/govee2mqtt
arch:
  - amd64
  - aarch64
init: false
startup: services
services:
  - mqtt:need

apparmor: true

ingress: true
ingress_port: 8056
panel_icon: mdi:lightbulb-group
panel_title: Govee

# Host network access is required for LAN discovery
host_network: true

map:
  - type: addon_config
    read_only: false
    path: /app/config

options:
  temperature_scale: "C"
  http_allowed_clients: ""

schema:
  temperature_scale: "str?"
  govee_email: "str?"
  govee_password: "password?"
  govee_api_key: "password?"
  mqtt_host: "str?"
  mqtt_port: "int?"
  mqtt_username: "str?"
  mqtt_password: "password?"
  debug_level: "str?"
  no_multicast: "bool?"
  broadcast_all: "bool?"
  global_broadcast: "bool?"
  scan: "str?"
  http_allowed_clients: "str?"
